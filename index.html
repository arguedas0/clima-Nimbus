<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nimbus Clima: consulte o clima agora e a previsão dos próximos dias de qualquer cidade.">
  <title>Clima Nimbus/title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
      <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

  <!-- ===== TOPO: marca, navegação e busca ===== -->
  <header class="topo">
    <div class="container topo__conteudo">
      <a class="marca" href="#agora" aria-label="Nimbus Clima, início">
        <span aria-hidden="true">🌤️</span> Clima Nimbus
      </a>

      <nav class="menu" aria-label="Principal">
        <ul>
          <li><a href="#agora">Agora</a></li>
          <li><a href="#previsao">Próximos dias</a></li>
          <li><a href="#chuva">Chuva</a></li>
          <li><a href="#sobre">Dúvidas</a></li>
        </ul>
      </nav>

      <form id="form-busca" class="busca" role="search">
        <label for="cidade-input" class="sr-only">Nome da cidade</label>
        <input type="search" id="cidade-input" name="cidade" placeholder="Buscar cidade" autocomplete="off" required>
        <button type="submit" id="btn-buscar" class="botao">Buscar</button>
        <button type="button" id="btn-localizacao" class="botao botao--secundario">📍 Usar minha localização</button>
      </form>
    </div>
  </header>

  <main id="conteudo" class="container">

  </main>

</body>
</html>
