<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nimbus Clima: consulte o clima agora e a previsão dos próximos dias de qualquer cidade.">
  <title>Clima Nimbus/title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
      <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

  <!-- ===== TOPO: marca, navegação e busca ===== -->
  <header class="topo">
    <div class="container topo__conteudo">
      <a class="marca" href="#agora" aria-label="Nimbus Clima, início">
        <span aria-hidden="true">🌤️</span> Clima Nimbus
      </a>

      <nav class="menu" aria-label="Principal">
        <ul>
          <li><a href="#agora">Agora</a></li>
          <li><a href="#previsao">Próximos dias</a></li>
          <li><a href="#chuva">Chuva</a></li>
          <li><a href="#sobre">Dúvidas</a></li>
        </ul>
      </nav>

      <form id="form-busca" class="busca" role="search">
        <label for="cidade-input" class="sr-only">Nome da cidade</label>
        <input type="search" id="cidade-input" name="cidade" placeholder="Buscar cidade" autocomplete="off" required>
        <button type="submit" id="btn-buscar" class="botao">Buscar</button>
        <button type="button" id="btn-localizacao" class="botao botao--secundario">📍 Usar minha localização</button>
      </form>
    </div>
  </header>

  <main id="conteudo" class="container">
        
    <p id="mensagem-carregando" class="mensagem" role="status" hidden>Buscando previsão...</p>
    <p id="mensagem-erro" class="mensagem mensagem--erro" role="alert" hidden></p>

    <section id="agora" class="agora" data-clima="ceu-limpo" aria-labelledby="nome-cidade">
      <div class="agora__principal">
        <p class="agora__rotulo">Tempo agora</p>
        <h1 id="nome-cidade">São Paulo, SP</h1>
        <p class="agora__atualizacao">Atualizado às <time id="hora-atualizacao" datetime="2026-11-03T14:00">14:00</time></p>

        <p class="agora__temperatura">
          <span id="icone-clima" class="icone" aria-hidden="true">⛅</span>
          <span id="temperatura">24°C</span>
        </p>
        <p id="descricao-clima" class="agora__descricao">Sol entre nuvens</p>
      </div>

      <dl class="detalhes">
        <div class="detalhe"><dt>Sensação</dt><dd id="sensacao">26°C</dd></div>
        <div class="detalhe"><dt>Umidade</dt><dd id="umidade">60%</dd></div>
        <div class="detalhe"><dt>Vento</dt><dd id="vento">12 km/h</dd></div>
        <div class="detalhe"><dt>Mín / Máx hoje</dt><dd id="min-max">16° / 31°</dd></div>
      </dl>
    </section>
    
  </main>

</body>
</html>
